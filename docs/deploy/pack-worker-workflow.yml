# [REFERENCE COPY] Bản copy của .github/workflows/pack-worker.yml — push bằng PAT thiếu scope
# "workflow" bị GitHub chặn. Để bật CI đóng gói worker bundle:
#   1. GitHub repo → Add file → Create file → đặt path: .github/workflows/pack-worker.yml
#   2. Dán TOÀN BỘ nội dung file này (bỏ 4 dòng chú thích đầu) → Commit.
#   3. Không cần bật gì thêm — Release rolling `worker-bundle` tự tạo lần đầu chạy.
# Mỗi commit lên main → đóng gói zip worker + packages → Release rolling + artifact.
name: Pack worker bundle

on:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'docs/deploy/20-worker-sandbox.md'
      - 'apps/worker/scripts/pack-worker-bundle.ts'
      - 'docs/deploy/pack-worker-workflow.yml'
  workflow_dispatch:

permissions:
  contents: write # tạo/upload Release rolling `worker-bundle`

concurrency:
  group: pack-worker
  cancel-in-progress: true

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git sha vào tên/tệp manifest

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pack bundle
        run: bun apps/worker/scripts/pack-worker-bundle.ts

      - name: Sanity check zip + checksum
        run: |
          test -s apps/worker/dist/worker-bundle.zip
          cd apps/worker/dist && sha256sum -c worker-bundle.zip.sha256

      - name: Upload artifact (traceability 30 ngày)
        uses: actions/upload-artifact@v4
        with:
          name: worker-bundle
          path: |
            apps/worker/dist/worker-bundle.zip
            apps/worker/dist/worker-bundle.zip.sha256
            apps/worker/dist/MANIFEST.txt
          retention-days: 30

      - name: Publish rolling release (tag worker-bundle)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view worker-bundle --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create worker-bundle --repo "$GITHUB_REPOSITORY" \
              --title "Worker bundle (rolling)" \
              --notes "Bundle source worker đóng gói TỰ ĐỘNG từ main. Tải worker-bundle.zip (+ .sha256 để kiểm tra, MANIFEST.txt để xem version/file list). Hướng dẫn boot: START-HERE.md trong zip. URL luôn bản mới nhất: https://github.com/$GITHUB_REPOSITORY/releases/download/worker-bundle/worker-bundle.zip"
          gh release upload worker-bundle \
            apps/worker/dist/worker-bundle.zip \
            apps/worker/dist/worker-bundle.zip.sha256 \
            apps/worker/dist/MANIFEST.txt \
            --repo "$GITHUB_REPOSITORY" --clobber
