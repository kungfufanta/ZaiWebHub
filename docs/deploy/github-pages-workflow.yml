# [REFERENCE COPY] Bản copy của .github/workflows/deploy-docs.yml — push KHÔNG được bằng PAT
# thiếu scope "workflow". Để bật CI deploy GitHub Pages:
#   1. GitHub repo → Add file → Create file → đặt path: .github/workflows/deploy-docs.yml
#   2. Dán TOÀN BỘ nội dung file này (bỏ 4 dòng chú thích đầu) → Commit.
#   3. Settings → Pages → Source: "GitHub Actions" (bật 1 lần duy nhất).
# Deploy site docs static (tab /docs export) lên GitHub Pages — Task 3.7-D.
# Trigger khi nguồn docs thay đổi (api-docs.ts / export script / workflow).
# YÊU CẦU 1 LẦN DUY NHẤT: bật Settings → Pages → Source: "GitHub Actions".
name: Deploy docs site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/dev-console/src/lib/api-docs.ts'
      - 'apps/dev-console/scripts/export-docs-site.ts'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Script thuần TS, không dependency → chỉ cần bun, KHÔNG cần bun install.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Export docs site
        run: bun apps/dev-console/scripts/export-docs-site.ts
      - name: Sanity check output
        run: test -s apps/dev-console/docs-site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dev-console/docs-site

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
